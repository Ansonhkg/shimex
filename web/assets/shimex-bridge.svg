<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 608" role="img" aria-labelledby="title desc">
  <title id="title">Shimex host and client bridge</title>
  <desc id="desc">A Shimex host keeps provider credentials while a remote Tailscale client connects to the same Codex Desktop experience through a revocable token.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset=".55" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#737373" stop-opacity="0"/>
      <stop offset=".42" stop-color="#a3a3a3"/>
      <stop offset=".7" stop-color="#0070f3"/>
      <stop offset="1" stop-color="#0070f3" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #ededed; font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
      .caption { fill: #888; font-size: 16px; font-weight: 600; }
      .mono { fill: #ededed; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; font-weight: 700; }
      .win { fill: #171717; stroke: #2a2a2a; stroke-width: 1.5; }
      .side { fill: #111; }
      .line { stroke: #2c2c2c; stroke-width: 1; }
      .muted { fill: #6f6f6f; font-size: 10px; font-weight: 600; }
      .small { fill: #d4d4d4; font-size: 11px; font-weight: 600; }
      .heading { fill: #f5f5f5; font-size: 12px; font-weight: 700; }
      .chip { fill: #d4d4d4; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; }
      .host-chip { fill: #171717; stroke: #404040; }
      .client-chip { fill: #101c2d; stroke: #1d4f8f; }
      #bridge { stroke-dasharray: 10 12; animation: dash 12s linear infinite; }
      #invite { animation: invite 12s cubic-bezier(.2,.8,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
      #hostAura { animation: hostAura 12s ease-in-out infinite; }
      #clientAura { animation: clientAura 12s ease-in-out infinite; }
      #lock { animation: lock 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      #clientBadge { animation: badge 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      #p1, #p2, #p3 { animation: packet 12s linear infinite; }
      #p2 { animation-delay: .7s; }
      #p3 { animation-delay: 1.4s; }
      @keyframes dash { 0%,55% { stroke-dashoffset: 0; opacity: .35; } 60%,82% { opacity: .9; } 100% { stroke-dashoffset: -88; opacity: .35; } }
      @keyframes invite { 0%,14% { opacity: 0; transform: translate(0) scale(.85); } 18% { opacity: 1; transform: translate(0) scale(1); } 34% { opacity: 1; transform: translate(300px) scale(1); } 48%,100% { opacity: 0; transform: translate(300px) scale(.9); } }
      @keyframes hostAura { 0%,8% { opacity: .08; } 14%,22% { opacity: .22; } 30%,100% { opacity: .08; } }
      @keyframes clientAura { 0%,30% { opacity: .08; } 38%,55% { opacity: .22; } 70%,100% { opacity: .1; } }
      @keyframes lock { 0%,32% { opacity: 0; transform: translateY(6px); } 38%,55% { opacity: 1; transform: translateY(0); } 62%,100% { opacity: 0; transform: translateY(-2px); } }
      @keyframes badge { 0%,34% { opacity: 0; transform: translateY(4px); } 40%,92% { opacity: 1; transform: translateY(0); } 98%,100% { opacity: 0; } }
      @keyframes packet { 0%,54% { opacity: 0; transform: translateX(0); } 58% { opacity: 1; transform: translateX(16px); } 78% { opacity: 1; transform: translateX(260px); } 84%,100% { opacity: 0; transform: translateX(290px); } }
      @media (prefers-reduced-motion: reduce) {
        #bridge, #invite, #hostAura, #clientAura, #lock, #clientBadge, #p1, #p2, #p3 { animation: none; }
        #invite, #clientBadge { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1080" height="608" rx="22" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="160" fill="#fff" opacity=".035"/>
  <circle cx="900" cy="480" r="180" fill="#0070f3" opacity=".045"/>

  <image href="../icon.png" x="56" y="30" width="44" height="44" preserveAspectRatio="xMidYMid slice"/>
  <text x="114" y="58" class="title">Shimex host/client bridge</text>
  <text x="114" y="86" class="caption">Use the same Codex Desktop profiles from a remote Tailscale machine</text>

  <path id="bridge" d="M400 300 C500 250 580 350 680 300" fill="none" stroke="url(#beam)" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <circle id="p1" cx="400" cy="300" r="6" fill="#d4d4d4"/>
    <circle id="p2" cx="400" cy="300" r="5" fill="#0070f3"/>
    <circle id="p3" cx="400" cy="300" r="5" fill="#60a5fa"/>
  </g>

  <!-- host -->
  <g transform="translate(56 148)">
    <circle id="hostAura" cx="170" cy="150" r="148" fill="#fff" opacity=".12" filter="url(#glow)"/>
    <rect class="win" width="340" height="300" rx="16"/>
    <circle cx="18" cy="16" r="4" fill="#ff5f57"/><circle cx="34" cy="16" r="4" fill="#febc2e"/><circle cx="50" cy="16" r="4" fill="#28c840"/>
    <path d="M0 29h340M92 29v271M262 29v271" class="line"/>
    <rect class="side" x="0" y="29" width="92" height="271"/>
    <g transform="translate(10 40)">
      <image href="../icon.png" width="18" height="18" preserveAspectRatio="xMidYMid slice"/>
      <text x="24" y="13" class="heading">Shimex</text>
      <rect y="28" width="72" height="18" rx="6" fill="#1f1f1f"/><text x="8" y="40" class="muted">New chat</text>
      <text x="2" y="66" class="muted">Recents</text>
      <rect y="74" width="72" height="16" rx="5" fill="#242424"/><text x="6" y="85" class="small" font-size="9">host setup</text>
      <rect y="96" width="72" height="14" rx="5" fill="#1a1a1a"/><text x="6" y="106" class="muted">providers</text>
    </g>
    <g transform="translate(100 40)">
      <text y="10" class="heading">Host keeps profiles</text>
      <rect y="24" width="150" height="42" rx="10" fill="#232323"/>
      <text x="10" y="42" class="small">Grok 4.6 · Cline · Codex</text><text x="10" y="56" class="muted">sessions stay here</text>
      <g transform="translate(0 78)">
        <rect width="150" height="22" rx="7" class="host-chip"/><text x="8" y="15" class="chip">API keys</text>
        <rect y="28" width="150" height="22" rx="7" class="host-chip"/><text x="8" y="43" class="chip">auth profiles</text>
        <rect y="56" width="150" height="22" rx="7" class="host-chip"/><text x="8" y="71" class="chip">model access</text>
      </g>
      <rect y="196" width="150" height="28" rx="14" fill="#202020" stroke="#333"/><text x="12" y="214" class="muted">Ask Shimex…</text>
    </g>
    <g transform="translate(270 42)"><text class="muted">Env</text><rect y="10" width="58" height="14" rx="5" fill="#222"/><text x="6" y="20" class="small" font-size="9">Local</text><text y="68" class="muted">Sources</text><rect y="78" width="58" height="12" rx="4" fill="#1b1b1b"/></g>
    <rect x="12" y="276" width="54" height="16" rx="8" fill="#ededed"/><text x="24" y="287" fill="#000" font-size="11" font-weight="700">HOST</text>
  </g>

  <!-- remote client -->
  <g transform="translate(684 148)">
    <circle id="clientAura" cx="170" cy="150" r="148" fill="#0070f3" opacity=".1" filter="url(#glow)"/>
    <rect class="win" width="340" height="300" rx="16"/>
    <circle cx="18" cy="16" r="4" fill="#ff5f57"/><circle cx="34" cy="16" r="4" fill="#febc2e"/><circle cx="50" cy="16" r="4" fill="#28c840"/>
    <path d="M0 29h340M92 29v271M262 29v271" class="line"/><rect class="side" y="29" width="92" height="271"/>
    <g transform="translate(10 40)">
      <image href="../icon.png" width="18" height="18" preserveAspectRatio="xMidYMid slice"/><text x="24" y="13" class="heading">Shimex</text>
      <rect y="28" width="72" height="18" rx="6" fill="#1f1f1f"/><text x="8" y="40" class="muted">New chat</text><text x="2" y="66" class="muted">Recents</text>
      <rect y="74" width="72" height="16" rx="5" fill="#172033"/><text x="6" y="85" class="small" font-size="9">paired chat</text>
    </g>
    <g transform="translate(100 40)">
      <text y="10" class="heading">Remote client</text>
      <rect y="24" width="150" height="34" rx="10" fill="#232323"/><text x="10" y="44" class="small">using host models…</text>
      <rect y="68" width="150" height="34" rx="10" class="client-chip"/><text x="10" y="88" fill="#93c5fd" font-size="10" font-weight="600">Grok 4.6 · via host</text>
      <rect y="112" width="150" height="34" rx="10" class="client-chip"/><text x="10" y="132" fill="#93c5fd" font-size="10" font-weight="600">no local secrets</text>
      <rect y="196" width="150" height="28" rx="14" fill="#202020" stroke="#333"/><text x="12" y="214" class="muted">Ask Shimex…</text>
    </g>
    <g transform="translate(270 42)"><text class="muted">Env</text><rect y="10" width="58" height="14" rx="5" fill="#222"/><text x="6" y="20" class="small" font-size="9">Remote</text><rect y="30" width="58" height="14" rx="5" fill="#101c2d"/><text x="6" y="40" fill="#93c5fd" font-size="9" font-weight="600">paired</text><text y="68" class="muted">Sources</text><rect y="78" width="58" height="12" rx="4" fill="#1b1b1b"/></g>
    <g id="lock" transform="translate(132 118)"><rect x="18" y="22" width="40" height="30" rx="8" fill="#101c2d" stroke="#1d4f8f" stroke-width="2"/><path d="M28 22v-7a10 10 0 0 1 20 0v7" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/></g>
    <g id="clientBadge" transform="translate(12 276)"><rect width="70" height="16" rx="8" fill="#0070f3"/><text x="14" y="11" fill="#fff" font-size="11" font-weight="700">CLIENT</text></g>
  </g>

  <g id="invite" transform="translate(390 268)">
    <rect width="190" height="58" rx="16" fill="#111" stroke="#525252" stroke-width="2" filter="url(#glow)"/>
    <image href="../icon.png" x="12" y="12" width="34" height="34" preserveAspectRatio="xMidYMid slice"/>
    <text x="56" y="27" class="chip" font-size="13">invite link</text><text x="56" y="46" fill="#a3a3a3" class="chip">/join?c=PHGC…</text>
  </g>

  <g transform="translate(56 500)">
    <rect width="968" height="64" rx="16" fill="#080808" stroke="#262626"/>
    <circle cx="34" cy="32" r="8" fill="#ededed"><animate attributeName="fill" values="#ededed;#0070f3;#ededed" dur="12s" repeatCount="indefinite"/></circle>
    <text x="58" y="38" class="mono">Host keeps credentials · remote clients use models through the bridge</text>
  </g>
</svg>
